<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sinh viên</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">← Trang chủ</a>
        <h1>Quản lý Sinh viên</h1>
    </header>

    <div class="page-body">
        <!-- SEARCH BAR -->
        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Tìm kiếm theo mã SV, họ tên, email, lớp...">
        </div>

        <!-- ACTION BUTTONS -->
        <div class="action-bar">
            <button class="btn btn-dark" onclick="openAddModal()">+ Thêm</button>
            <button class="btn btn-dark" onclick="openEditModal()">✏️ Sửa</button>
            <button class="btn btn-dark" onclick="exportData()">📄 Tải danh sách</button>
            <button class="btn btn-red" onclick="deleteSelected()">Xóa</button>
        </div>

        <!-- TABLE CARD -->
        <div class="table-card">
            <div class="table-header">
                <span>👥</span>
                <span id="countLabel">Đã tải 0 sinh viên</span>
            </div>

            <table>
                <thead>
                    <tr>
                        <th class="center"><input type="checkbox" id="checkAll" onchange="toggleAllCheckboxes()"></th>
                        <th>Mã SV</th>
                        <th>Họ tên</th>
                        <th>Email</th>
                        <th>Lớp</th>
                        <th class="center">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="6" class="empty-row">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>

            <!-- PAGINATION -->
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- MODAL THÊM/SỬA -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">Thêm sinh viên</h2>
            <div class="modal-field">
                <label>Mã sinh viên *</label>
                <input type="text" id="modalMaSV" placeholder="VD: SV001">
            </div>
            <div class="modal-field">
                <label>Họ tên *</label>
                <input type="text" id="modalHoTen" placeholder="VD: Nguyễn Văn A">
            </div>
            <div class="modal-field">
                <label>Email *</label>
                <input type="email" id="modalEmail" placeholder="VD: example@gmail.com">
            </div>
            <div class="modal-field">
                <label>Lớp</label>
                <input type="text" id="modalLop" placeholder="VD: CNTT01">
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeModal()">Hủy</button>
                <button class="btn btn-dark" id="modalSubmitBtn" onclick="submitModal()">Lưu</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script src="../js/common.js"></script>
    <script src="../js/students.js"></script>

</body>
</html>
