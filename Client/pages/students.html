<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sinh viên</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">← Trang chủ</a>
        <h1>Quản lý Sinh viên</h1>
        <span class="header-badge">StudentService :9001</span>
    </header>

    <main>
        <section class="card">

            <!-- FORM -->
            <div class="form-grid">
                <div class="form-group">
                    <label>Mã sinh viên <span class="required">*</span></label>
                    <input type="text" id="maSV" placeholder="VD: SV001">
                </div>
                <div class="form-group">
                    <label>Họ tên <span class="required">*</span></label>
                    <input type="text" id="hoTen" placeholder="VD: Nguyễn Văn A">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="VD: example@email.com">
                </div>
                <div class="form-group">
                    <label>Lớp</label>
                    <input type="text" id="lop" placeholder="VD: CNTT01">
                </div>
            </div>

            <!-- BUTTONS -->
            <div class="buttons">
                <button class="btn-primary" onclick="themSinhVien()">➕ Thêm</button>
                <button class="btn-warning" onclick="suaSinhVien()">✏️ Sửa</button>
                <button class="btn-danger" onclick="xoaSinhVien()">🗑️ Xóa</button>
                <button class="btn-secondary" onclick="loadSinhVien()">🔄 Tải danh sách</button>
                <button class="btn-secondary" onclick="xoaForm()">✖ Xóa form</button>
            </div>

            <!-- THÔNG BÁO -->
            <div id="message"></div>

            <!-- TABLE -->
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Mã SV</th>
                            <th>Họ tên</th>
                            <th>Email</th>
                            <th>Lớp</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="studentTable">
                        <tr>
                            <td colspan="5" class="empty-row">Nhấn "Tải danh sách" để xem dữ liệu</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>
    </main>

    <script>
        const API = 'http://localhost:9001/api/students';

        // Điền dữ liệu vào form khi click vào hàng
        function selectRow(maSV, hoTen, email, lop) {
            document.getElementById('maSV').value = maSV;
            document.getElementById('hoTen').value = hoTen;
            document.getElementById('email').value = email;
            document.getElementById('lop').value = lop;
            showMessage('Đã chọn sinh viên: ' + maSV, 'info');
        }

        function xoaForm() {
            document.getElementById('maSV').value = '';
            document.getElementById('hoTen').value = '';
            document.getElementById('email').value = '';
            document.getElementById('lop').value = '';
            clearMessage();
        }

        function showMessage(msg, type = 'success') {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.className = 'message ' + type;
        }

        function clearMessage() {
            const el = document.getElementById('message');
            el.textContent = '';
            el.className = 'message';
        }

        function renderTable(students) {
            const tbody = document.getElementById('studentTable');
            if (!students || students.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-row">Không có dữ liệu</td></tr>';
                return;
            }
            tbody.innerHTML = students.map(sv => `
                <tr onclick="selectRow('${sv.maSV}','${escHtml(sv.hoTen)}','${escHtml(sv.email || '')}','${escHtml(sv.lop || '')}')">
                    <td>${escHtml(sv.maSV)}</td>
                    <td>${escHtml(sv.hoTen)}</td>
                    <td>${escHtml(sv.email || '')}</td>
                    <td>${escHtml(sv.lop || '')}</td>
                    <td>
                        <button class="btn-danger btn-sm" onclick="event.stopPropagation(); xoaNhanh('${sv.maSV}')">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        async function loadSinhVien() {
            try {
                const res = await fetch(API);
                const data = await res.json();
                renderTable(data);
                showMessage('Đã tải ' + data.length + ' sinh viên', 'success');
            } catch (err) {
                showMessage('Lỗi kết nối StudentService (:9001): ' + err.message, 'error');
            }
        }

        async function themSinhVien() {
            const maSV  = document.getElementById('maSV').value.trim();
            const hoTen = document.getElementById('hoTen').value.trim();
            const email = document.getElementById('email').value.trim();
            const lop   = document.getElementById('lop').value.trim();

            if (!maSV || !hoTen) {
                showMessage('Mã sinh viên và họ tên không được để trống', 'error');
                return;
            }

            try {
                const res = await fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ maSV, hoTen, email, lop })
                });
                const data = await res.json();

                if (res.status === 201) {
                    showMessage('Thêm sinh viên ' + maSV + ' thành công!', 'success');
                    xoaForm();
                    loadSinhVien();
                } else {
                    showMessage(data.message || 'Lỗi: ' + res.status, 'error');
                }
            } catch (err) {
                showMessage('Lỗi kết nối: ' + err.message, 'error');
            }
        }

        async function suaSinhVien() {
            const maSV  = document.getElementById('maSV').value.trim();
            const hoTen = document.getElementById('hoTen').value.trim();
            const email = document.getElementById('email').value.trim();
            const lop   = document.getElementById('lop').value.trim();

            if (!maSV || !hoTen) {
                showMessage('Chọn sinh viên và nhập họ tên để sửa', 'error');
                return;
            }

            try {
                const res = await fetch(API + '/' + maSV, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hoTen, email, lop })
                });
                const data = await res.json();

                if (res.ok) {
                    showMessage('Cập nhật sinh viên ' + maSV + ' thành công!', 'success');
                    loadSinhVien();
                } else {
                    showMessage(data.message || 'Lỗi: ' + res.status, 'error');
                }
            } catch (err) {
                showMessage('Lỗi kết nối: ' + err.message, 'error');
            }
        }

        async function xoaSinhVien() {
            const maSV = document.getElementById('maSV').value.trim();
            if (!maSV) {
                showMessage('Chọn sinh viên cần xóa', 'error');
                return;
            }
            if (!confirm('Xác nhận xóa sinh viên ' + maSV + '?')) return;

            try {
                const res = await fetch(API + '/' + maSV, { method: 'DELETE' });
                const data = await res.json();

                if (res.ok) {
                    showMessage('Đã xóa sinh viên ' + maSV, 'success');
                    xoaForm();
                    loadSinhVien();
                } else {
                    showMessage(data.message || 'Lỗi: ' + res.status, 'error');
                }
            } catch (err) {
                showMessage('Lỗi kết nối: ' + err.message, 'error');
            }
        }

        async function xoaNhanh(maSV) {
            if (!confirm('Xác nhận xóa sinh viên ' + maSV + '?')) return;
            try {
                const res = await fetch(API + '/' + maSV, { method: 'DELETE' });
                const data = await res.json();
                if (res.ok) {
                    showMessage('Đã xóa sinh viên ' + maSV, 'success');
                    loadSinhVien();
                } else {
                    showMessage(data.message || 'Lỗi: ' + res.status, 'error');
                }
            } catch (err) {
                showMessage('Lỗi kết nối: ' + err.message, 'error');
            }
        }

        // Tải danh sách ngay khi mở trang
        loadSinhVien();
    </script>

</body>
</html>
