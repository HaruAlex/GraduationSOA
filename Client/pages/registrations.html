<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Đề tài</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">← Trang chủ</a>
        <h1>Đăng ký Đề tài</h1>
        <span class="header-badge">RegistrationService :9003</span>
    </header>

    <main>
        <section class="card">

            <!-- FORM -->
            <div class="form-grid form-grid-2">
                <div class="form-group">
                    <label>Mã sinh viên <span class="required">*</span></label>
                    <input type="text" id="regMaSV" placeholder="VD: SV001">
                </div>
                <div class="form-group">
                    <label>Mã đề tài <span class="required">*</span></label>
                    <input type="text" id="regMaDT" placeholder="VD: DT001">
                </div>
            </div>

            <!-- BUTTONS -->
            <div class="buttons">
                <button class="btn-primary" onclick="dangKy()">📝 Đăng ký</button>
                <button class="btn-danger" onclick="huyDangKy()">🗑️ Hủy đăng ký</button>
                <button class="btn-secondary" onclick="loadDangKy()">🔄 Tải danh sách</button>
                <button class="btn-secondary" onclick="xoaForm()">✖ Xóa form</button>
            </div>

            <!-- THÔNG BÁO -->
            <div id="message"></div>

            <!-- TABLE -->
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Mã SV</th>
                            <th>Mã ĐT</th>
                            <th>Ngày đăng ký</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="registrationTable">
                        <tr>
                            <td colspan="4" class="empty-row">Nhấn "Tải danh sách" để xem dữ liệu</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>
    </main>

    <script>
        const API = 'http://localhost:9003/api/registrations';

        function selectRow(maSV, maDT) {
            document.getElementById('regMaSV').value = maSV;
            document.getElementById('regMaDT').value = maDT;
            showMessage('Đã chọn: ' + maSV + ' → ' + maDT, 'info');
        }

        function xoaForm() {
            document.getElementById('regMaSV').value = '';
            document.getElementById('regMaDT').value = '';
            clearMessage();
        }

        function showMessage(msg, type = 'success') {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.className = 'message ' + type;
        }

        function clearMessage() {
            const el = document.getElementById('message');
            el.textContent = '';
            el.className = 'message';
        }

        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            // Format: "2024-01-15 10:30:00.0" → "15/01/2024 10:30"
            try {
                const d = new Date(dateStr);
                if (isNaN(d)) return dateStr;
                return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
            } catch {
                return dateStr;
            }
        }

        function renderTable(registrations) {
            const tbody = document.getElementById('registrationTable');
            if (!registrations || registrations.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-row">Không có dữ liệu</td></tr>';
                return;
            }
            tbody.innerHTML = registrations.map(r => `
                <tr onclick="selectRow('${r.maSV}','${r.maDT}')">
                    <td>${escHtml(r.maSV)}</td>
                    <td>${escHtml(r.maDT)}</td>
                    <td>${escHtml(formatDate(r.ngayDangKy))}</td>
                    <td>
                        <button class="btn-danger btn-sm" onclick="event.stopPropagation(); huyNhanh('${r.maSV}','${r.maDT}')">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        async function loadDangKy() {
            try {
                const res = await fetch(API);
                const data = await res.json();
                renderTable(data);
                showMessage('Đã tải ' + data.length + ' đăng ký', 'success');
            } catch (err) {
                showMessage('Lỗi kết nối RegistrationService (:9003): ' + err.message, 'error');
            }
        }

        async function dangKy() {
            const maSV = document.getElementById('regMaSV').value.trim();
            const maDT = document.getElementById('regMaDT').value.trim();

            if (!maSV || !maDT) {
                showMessage('Mã sinh viên và mã đề tài không được để trống', 'error');
                return;
            }

            try {
                const res = await fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ maSV, maDT })
                });
                const data = await res.json();

                if (res.status === 201) {
                    showMessage('Đăng ký thành công: ' + maSV + ' → ' + maDT, 'success');
                    xoaForm();
                    loadDangKy();
                } else {
                    showMessage(data.error || data.message || 'Lỗi: ' + res.status, 'error');
                }
            } catch (err) {
                showMessage('Lỗi kết nối: ' + err.message, 'error');
            }
        }

        async function huyDangKy() {
            const maSV = document.getElementById('regMaSV').value.trim();
            const maDT = document.getElementById('regMaDT').value.trim();

            if (!maSV || !maDT) {
                showMessage('Chọn đăng ký cần hủy (click vào hàng trong bảng)', 'error');
                return;
            }
            if (!confirm('Xác nhận hủy đăng ký: ' + maSV + ' → ' + maDT + '?')) return;

            try {
                const res = await fetch(API + '/' + maSV + '/' + maDT, { method: 'DELETE' });
                const data = await res.json();

                if (res.ok) {
                    showMessage('Đã hủy đăng ký: ' + maSV + ' → ' + maDT, 'success');
                    xoaForm();
                    loadDangKy();
                } else {
                    showMessage(data.error || data.message || 'Lỗi: ' + res.status, 'error');
                }
            } catch (err) {
                showMessage('Lỗi kết nối: ' + err.message, 'error');
            }
        }

        async function huyNhanh(maSV, maDT) {
            if (!confirm('Xác nhận hủy đăng ký: ' + maSV + ' → ' + maDT + '?')) return;
            try {
                const res = await fetch(API + '/' + maSV + '/' + maDT, { method: 'DELETE' });
                const data = await res.json();
                if (res.ok) {
                    showMessage('Đã hủy đăng ký: ' + maSV + ' → ' + maDT, 'success');
                    loadDangKy();
                } else {
                    showMessage(data.error || data.message || 'Lỗi: ' + res.status, 'error');
                }
            } catch (err) {
                showMessage('Lỗi kết nối: ' + err.message, 'error');
            }
        }

        // Tải danh sách ngay khi mở trang
        loadDangKy();
    </script>

</body>
</html>
