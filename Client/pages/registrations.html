<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Đề tài</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">← Trang chủ</a>
        <h1>Đăng ký Đề tài</h1>
    </header>

    <div class="page-body">
        <!-- SEARCH BAR -->
        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Tìm kiếm theo mã SV, mã ĐT, ngày đăng ký...">
        </div>

        <!-- ACTION BUTTONS -->
        <div class="action-bar">
            <button class="btn btn-dark" onclick="openAddModal()">+ Thêm</button>
            <button class="btn btn-dark" onclick="openEditModal()">✏️ Sửa</button>
            <button class="btn btn-dark" onclick="exportData()">📄Tải danh sách</button>
        </div>

        <!-- TABLE CARD -->
        <div class="table-card">
            <div class="table-header">
                <span>📝</span>
                <span id="countLabel">Đã tải 0 đăng ký</span>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Mã SV</th>
                        <th>Mã ĐT</th>
                        <th>Ngày đăng ký</th>
                        <th class="center">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="4" class="empty-row">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>

            <!-- PAGINATION -->
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- MODAL THÊM/SỬA -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">Đăng ký đề tài</h2>
            <div class="modal-field">
                <label>Mã sinh viên *</label>
                <input type="text" id="modalMaSV" placeholder="VD: SV001">
            </div>
            <div class="modal-field">
                <label>Mã đề tài *</label>
                <input type="text" id="modalMaDT" placeholder="VD: DT001">
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeModal()">Hủy</button>
                <button class="btn btn-dark" onclick="submitModal()">Lưu</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script src="../js/common.js"></script>
    <script src="../js/registrations.js"></script>

</body>
</html>
