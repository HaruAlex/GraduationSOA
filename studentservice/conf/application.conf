# Cấu hình cổng chạy cho Student Service
play.server.http.port = 9001

# Disable Filters để gọi API từ Client / Postman
play.filters.disabled += "play.filters.hosts.AllowedHostsFilter"
play.filters.disabled += "play.filters.csrf.CSRFFilter"

# Secret key
play.http.secret.key = "changeme_student_service_secret_key"

# Cấu hình kết nối SQL Server (Database GraduationSOA)
db.default.driver = com.microsoft.sqlserver.jdbc.SQLServerDriver
db.default.url = "jdbc:sqlserver://127.0.0.1:1433;databaseName=GraduationSOA;encrypt=false;trustServerCertificate=true;"
db.default.username = "sa"
db.default.password = "123456"